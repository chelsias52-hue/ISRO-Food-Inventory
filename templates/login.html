<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ISRO Food Inventory</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <div class="form-card">
            <h1>ISRO Food Inventory</h1>
            <p class="subtitle">Inventory Management System</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <p class="flash-message flash-{{ category }}" role="status">{{ message }}</p>
            {% endfor %}
            {% endwith %}
            <form method="POST">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" maxlength="254"
                       value="{{ email }}" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password"
                       autocomplete="current-password" required>

                <button type="submit">Login</button>
            </form>
        </div>
    </main>
</body>
</html>
