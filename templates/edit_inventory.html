<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Inventory - ISRO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "_navigation.html" %}

    <main>
        <h1>Edit Inventory</h1>
        <p class="subtitle">Update stock levels and storage details.</p>
        <div class="form-card">
            <h2>{{ food_name }}</h2>
            {% if errors %}
            <div class="form-errors" role="alert">
                <p>Please correct the following:</p>
                <ul>
                    {% for error in errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <form method="POST">
                <label for="quantity">Quantity</label>
                <input id="quantity" type="number" name="quantity" min="0"
                       max="2147483647" step="1"
                       value="{{ form_data.get('quantity', '') }}" required>

                <label for="reorder_level">Reorder Level</label>
                <input id="reorder_level" type="number" name="reorder_level" min="0"
                       max="2147483647" step="1"
                       value="{{ form_data.get('reorder_level', '') }}" required>

                <label for="storage_location">Storage Location</label>
                <input id="storage_location" type="text" name="storage_location"
                       maxlength="100" value="{{ form_data.get('storage_location', '') }}"
                       required>

                <button type="submit">Update Inventory</button>
            </form>
        </div>
    </main>
</body>
</html>
